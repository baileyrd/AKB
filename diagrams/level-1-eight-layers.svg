<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title desc"><title id="title">MSYS2 eight-layer architecture</title><desc id="desc">Eight linked layers from Windows to applications.</desc><style>text{font-family:Arial,sans-serif;fill:#111827}.n{font-size:15px;font-weight:bold}.s{font-size:12px;fill:#4b5563}a:hover rect{stroke:#2563eb;stroke-width:3}</style><rect width="960" height="720" fill="white"/><text x="45" y="38" font-size="22" font-weight="bold">MSYS2 Architecture — Level 1</text><text x="45" y="60" class="s">Each layer is a stable Explorer navigation entry; it is not a call stack.</text>
<g stroke="#d1d5db" stroke-width="1.5"><a href="../generated/explorer/index.html#/view/packages"><rect x="150" y="90" width="660" height="58" rx="8" fill="#eff6ff"/><text x="180" y="115" class="n">8 · Applications and automation</text><text x="180" y="136" class="s">Git, interpreters, IDEs, developer and end-user applications</text></a><a href="../generated/explorer/index.html#/view/toolchains"><rect x="150" y="160" width="660" height="58" rx="8" fill="#f0fdf4"/><text x="180" y="185" class="n">7 · GNU userland and developer tools</text><text x="180" y="206" class="s">Bash, GNU utilities, build and diagnostic tools</text></a><a href="../generated/explorer/index.html#/view/toolchains"><rect x="150" y="230" width="660" height="58" rx="8" fill="#faf5ff"/><text x="180" y="255" class="n">6 · Toolchains and build systems</text><text x="180" y="276" class="s">GCC, LLVM, linkers, debuggers, generators</text></a><a href="../generated/explorer/index.html#/view/repositories"><rect x="150" y="300" width="660" height="58" rx="8" fill="#fff7ed"/><text x="180" y="325" class="n">5 · Packages, repositories, and pacman</text><text x="180" y="346" class="s">Snapshot-bound package metadata and declared dependencies</text></a><a href="../generated/explorer/index.html#/view/runtimes"><rect x="150" y="370" width="660" height="58" rx="8" fill="#fef2f2"/><text x="180" y="395" class="n">4 · MSYS and native runtime environments</text><text x="180" y="416" class="s">MSYS, UCRT64, CLANG64, CLANGARM64, MINGW64, MINGW32</text></a><a href="../generated/explorer/index.html#/object/runtime%3Amsys2%3Amsys-2.0.dll"><rect x="150" y="440" width="660" height="58" rx="8" fill="#f0fdfa"/><text x="180" y="465" class="n">3 · MSYS POSIX runtime adaptation</text><text x="180" y="486" class="s">Processes, paths, signals, filesystems, pseudo terminals</text></a><a href="../generated/explorer/index.html#/object/platform%3Amicrosoft%3Awindows"><rect x="150" y="510" width="660" height="58" rx="8" fill="#eff6ff"/><text x="180" y="535" class="n">2 · Windows user-mode services</text><text x="180" y="556" class="s">Win32, console, filesystem, networking, loader</text></a><a href="../generated/explorer/index.html#/object/platform%3Amicrosoft%3Awindows"><rect x="150" y="580" width="660" height="58" rx="8" fill="#f9fafb"/><text x="180" y="605" class="n">1 · Windows kernel and security services</text><text x="180" y="626" class="s">Processes, storage, memory, security and scheduling</text></a></g></svg>
