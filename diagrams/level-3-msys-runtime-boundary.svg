<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">MSYS runtime boundary</title><desc id="desc">A Level 3 linked view of an MSYS-dependent process, the msys-2.0.dll adaptation services, and Windows host services. Native environments bypass this boundary.</desc>
<style>text{font-family:Arial,sans-serif;fill:#111827}.t{font-size:22px;font-weight:bold}.l{font-size:14px;font-weight:bold}.s{font-size:12px;fill:#6b7280}a:hover rect{stroke:#2563eb;stroke-width:3}</style><defs><marker id="b" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker><marker id="g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#16a34a"/></marker></defs><rect width="960" height="560" fill="white"/><text x="40" y="40" class="t">MSYS2 Architecture — Level 3: MSYS runtime boundary</text><text x="40" y="62" class="s">The green path is native Windows execution; it does not imply MSYS runtime behavior.</text>
<rect x="40" y="100" width="250" height="340" rx="8" fill="#eff6ff" fill-opacity=".5" stroke="#bfdbfe" stroke-dasharray="6,4"/><text x="55" y="123" class="s">MSYS-DEPENDENT PROCESS</text><a href="../generated/explorer/index.html#/object/environment%3Amsys2%3Amsys"><rect x="70" y="155" width="190" height="68" rx="8" fill="#eff6ff" stroke="#bfdbfe"/><text x="165" y="183" text-anchor="middle" class="l">MSYS environment</text><text x="165" y="204" text-anchor="middle" class="s">shell, pacman, /usr</text></a><a href="../generated/explorer/index.html#/view/packages"><rect x="70" y="300" width="190" height="68" rx="8" fill="white" stroke="#d1d5db"/><text x="165" y="328" text-anchor="middle" class="l">MSYS-linked program</text><text x="165" y="349" text-anchor="middle" class="s">loads runtime dependency</text></a>
<rect x="355" y="100" width="250" height="340" rx="8" fill="#f0fdfa" fill-opacity=".5" stroke="#99f6e4" stroke-dasharray="6,4"/><text x="370" y="123" class="s">POSIX ADAPTATION BOUNDARY</text><a href="../generated/explorer/index.html#/object/runtime%3Amsys2%3Amsys-2.0.dll"><rect x="385" y="155" width="190" height="68" rx="8" fill="#f0fdfa" stroke="#99f6e4"/><text x="480" y="183" text-anchor="middle" class="l">msys-2.0.dll</text><text x="480" y="204" text-anchor="middle" class="s">runtime initialization</text></a><a href="../generated/explorer/index.html#/view/runtimes"><rect x="385" y="300" width="190" height="68" rx="8" fill="white" stroke="#d1d5db"/><text x="480" y="328" text-anchor="middle" class="l">Adaptation services</text><text x="480" y="349" text-anchor="middle" class="s">paths, fork/exec, signals, PTY</text></a>
<rect x="670" y="100" width="250" height="340" rx="8" fill="#f0fdf4" fill-opacity=".5" stroke="#bbf7d0" stroke-dasharray="6,4"/><text x="685" y="123" class="s">WINDOWS HOST SERVICES</text><a href="../generated/explorer/index.html#/object/platform%3Amicrosoft%3Awindows"><rect x="700" y="155" width="190" height="68" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/><text x="795" y="183" text-anchor="middle" class="l">Windows user mode</text><text x="795" y="204" text-anchor="middle" class="s">processes, loader, console</text></a><a href="../generated/explorer/index.html#/view/runtimes"><rect x="700" y="300" width="190" height="68" rx="8" fill="white" stroke="#d1d5db"/><text x="795" y="328" text-anchor="middle" class="l">Native environments</text><text x="795" y="349" text-anchor="middle" class="s">UCRT64, CLANG64, MinGW</text></a>
<path d="M260 334H385" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#b)"/><path d="M575 189H700" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#b)"/><path d="M480 223V300" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#b)"/><path d="M795 223V300" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#g)"/><path d="M575 334H700" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#g)"/><rect x="40" y="480" width="880" height="38" rx="6" fill="#f9fafb" stroke="#e5e7eb"/><text x="60" y="504" class="s">Blue: MSYS-dependent process crosses the POSIX adaptation boundary. Green: native environments call Windows-facing services directly.</text></svg>
