<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">Package to artifact evidence flow</title><desc id="desc">A Level 5 linked diagram of official repository metadata, a package archive, static artifact analysis, and the resulting package and binary dependency projections.</desc><style>text{font-family:Arial,sans-serif;fill:#111827}.t{font-size:22px;font-weight:bold}.l{font-size:14px;font-weight:bold}.s{font-size:12px;fill:#4b5563}a:hover rect{stroke:#2563eb;stroke-width:3}</style><defs><marker id="b" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker><marker id="g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#16a34a"/></marker></defs><rect width="960" height="520" fill="white"/><text x="40" y="42" class="t">MSYS2 Architecture — Level 5: Package-to-artifact evidence</text><text x="40" y="64" class="s">Repository records declare package dependencies; payload analysis supplies observed files, PE metadata, imports, and exports.</text>
<a href="../generated/explorer/index.html#/view/repositories"><rect x="55" y="145" width="170" height="76" rx="8" fill="#fff7ed" stroke="#fed7aa"/><text x="140" y="174" text-anchor="middle" class="l">Official repository</text><text x="140" y="195" text-anchor="middle" class="s">database snapshot</text></a><a href="../generated/explorer/index.html#/view/packages"><rect x="285" y="145" width="170" height="76" rx="8" fill="#eff6ff" stroke="#bfdbfe"/><text x="370" y="174" text-anchor="middle" class="l">Package record</text><text x="370" y="195" text-anchor="middle" class="s">version and declared deps</text></a><a href="../generated/explorer/index.html#/view/packages"><rect x="515" y="145" width="170" height="76" rx="8" fill="#faf5ff" stroke="#ddd6fe"/><text x="600" y="174" text-anchor="middle" class="l">.pkg.tar.zst</text><text x="600" y="195" text-anchor="middle" class="s">immutable payload hash</text></a><a href="../generated/explorer/index.html#/view/artifacts"><rect x="745" y="145" width="170" height="76" rx="8" fill="#f0fdfa" stroke="#99f6e4"/><text x="830" y="174" text-anchor="middle" class="l">Static analysis</text><text x="830" y="195" text-anchor="middle" class="s">no installation/execution</text></a>
