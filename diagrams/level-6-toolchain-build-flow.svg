<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">Toolchain and build output flow</title><desc id="desc">A Level 6 linked flow from source and build configuration through toolchains to observed artifacts and metadata.</desc><style>text{font-family:Arial,sans-serif;fill:#111827}.t{font-size:22px;font-weight:bold}.l{font-size:14px;font-weight:bold}.s{font-size:12px;fill:#4b5563}a:hover rect{stroke:#2563eb;stroke-width:3}</style><defs><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker></defs><rect width="960" height="440" fill="white"/><text x="40" y="42" class="t">MSYS2 Architecture — Level 6: Toolchain and build output</text><text x="40" y="64" class="s">Role flow, not a claim of a specific package’s exact recipe, flags, or source revision.</text><a href="../generated/explorer/index.html#/view/packages"><rect x="45" y="150" width="165" height="75" rx="8" fill="#fff7ed" stroke="#fed7aa"/><text x="127" y="180" text-anchor="middle" class="l">Source and recipe</text><text x="127" y="201" text-anchor="middle" class="s">inputs and patches</text></a><a href="../generated/explorer/index.html#/view/toolchains"><rect x="265" y="150" width="165" height="75" rx="8" fill="#eff6ff" stroke="#bfdbfe"/><text x="347" y="180" text-anchor="middle" class="l">Build system</text><text x="347" y="201" text-anchor="middle" class="s">CMake, Meson, Make</text></a><a href="../generated/explorer/index.html#/view/toolchains"><rect x="485" y="150" width="165" height="75" rx="8" fill="#faf5ff" stroke="#ddd6fe"/><text x="567" y="180" text-anchor="middle" class="l">Compiler / linker</text><text x="567" y="201" text-anchor="middle" class="s">GCC, Clang, ld, LLD</text></a><a href="../generated/explorer/index.html#/view/artifacts"><rect x="705" y="150" width="165" height="75" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/><text x="787" y="180" text-anchor="middle" class="l">Binary artifacts</text><text x="787" y="201" text-anchor="middle" class="s">EXE, DLL, library</text></a><a href="../generated/explorer/index.html#/view/evidenced"><rect x="390" y="290" width="180" height="70" rx="8" fill="white" stroke="#d1d5db"/><text x="480" y="319" text-anchor="middle" class="l">Observed metadata</text><text x="480" y="340" text-anchor="middle" class="s">headers, .pc, CMake, PE</text></a><path d="M210 187H265M430 187H485M650 187H705M787 225V260H480V290" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="385" width="825" height="30" rx="6" fill="#f9fafb" stroke="#e5e7eb"/><text x="60" y="405" class="s">Payload observations establish output facts; source and build provenance require independent, version-qualified evidence.</text></svg>
