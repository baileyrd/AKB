<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">Userland and applications</title><desc id="desc">A Level 7 linked diagram of terminal users and automation entering shells, GNU userland, Git for Windows, and native applications over the runtime and package layers.</desc><style>text{font-family:Arial,sans-serif;fill:#111827}.t{font-size:22px;font-weight:bold}.l{font-size:14px;font-weight:bold}.s{font-size:12px;fill:#4b5563}a:hover rect{stroke:#2563eb;stroke-width:3}</style><defs><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker></defs><rect width="960" height="440" fill="white"/><text x="40" y="42" class="t">MSYS2 Architecture — Level 7: Userland and applications</text><text x="40" y="64" class="s">Entry points select packages and environments; an application’s runtime and dependency set must remain explicit.</text><a href="../generated/explorer/index.html#/view/packages"><rect x="45" y="150" width="165" height="75" rx="8" fill="#eff6ff" stroke="#bfdbfe"/><text x="127" y="180" text-anchor="middle" class="l">Users / automation</text><text x="127" y="201" text-anchor="middle" class="s">terminal and scripts</text></a><a href="../generated/explorer/index.html#/object/environment%3Amsys2%3Amsys"><rect x="265" y="150" width="165" height="75" rx="8" fill="#f0fdfa" stroke="#99f6e4"/><text x="347" y="180" text-anchor="middle" class="l">Shell environment</text><text x="347" y="201" text-anchor="middle" class="s">Bash and MSYS tools</text></a><a href="../generated/explorer/index.html#/view/packages"><rect x="485" y="150" width="165" height="75" rx="8" fill="#fff7ed" stroke="#fed7aa"/><text x="567" y="180" text-anchor="middle" class="l">GNU userland</text><text x="567" y="201" text-anchor="middle" class="s">coreutils, SSH, tools</text></a><a href="../generated/explorer/index.html#/view/packages"><rect x="705" y="150" width="165" height="75" rx="8" fill="#faf5ff" stroke="#ddd6fe"/><text x="787" y="180" text-anchor="middle" class="l">Git for Windows</text><text x="787" y="201" text-anchor="middle" class="s">Git, helpers, transports</text></a><a href="../generated/explorer/index.html#/view/runtimes"><rect x="350" y="300" width="260" height="70" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/><text x="480" y="329" text-anchor="middle" class="l">Native applications and toolchains</text><text x="480" y="350" text-anchor="middle" class="s">target environment, CRT, libraries, DLL closure</text></a><path d="M210 187H265M430 187H485M650 187H705M787 225V265H480V300" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/><path d="M347 225V265H480V300" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="395" width="825" height="26" rx="6" fill="#f9fafb" stroke="#e5e7eb"/><text x="60" y="413" class="s">Use package and artifact views for current inventory; this diagram is a navigational model, not an exhaustive application list.</text></svg>
